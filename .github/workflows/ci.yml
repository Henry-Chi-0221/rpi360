name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - run: rustup default 1.98.1
      - run: cargo fmt --all --check && cargo test --workspace --locked
      - run: cargo build --release -p rpi360-ffi --locked
      - run: cargo install wasm-bindgen-cli --version 0.2.108 --locked
      - run: bash tools/release/build-wasm.sh
      - run: python -m pip install uv
      - run: uv sync --locked --all-packages --extra dev --python '${{ matrix.python }}'
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync pytest
      - run: uv build --package rpi360 --wheel
      - name: Contract definitions are reproducible
        run: |
          uv run --no-sync python tools/release/generate-contracts.py
          git diff --exit-code -- schemas
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.19.0
      - run: rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown
      - run: rustup default 1.98.1
      - run: cargo install wasm-bindgen-cli --version 0.2.108 --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm wasm && pnpm test && pnpm build
  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: rustup default 1.98.1
      - run: rustup target add aarch64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim
      - run: python3 tools/release/build-apple.py
      - run: swift test --package-path packages/apple-sdk
      - run: swift run --package-path packages/apple-sdk RPI360Smoke
