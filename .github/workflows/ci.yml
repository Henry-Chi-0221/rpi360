name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Ensure ffmpeg is available
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Ensure ffmpeg is available
        run: command -v ffmpeg || brew install ffmpeg
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/test_common.py tests/test_media.py tests/test_player.py
