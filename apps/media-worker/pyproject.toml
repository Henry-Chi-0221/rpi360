[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "rpi360-worker"
version = "2.0.0a1"
requires-python = ">=3.11"
dependencies = ["rpi360>=2.0.0a1", "av>=14,<18", "numpy>=2", "Pillow>=10", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
[project.scripts]
rpi360-worker = "rpi360_worker.api:main"
rpi360-export = "rpi360_worker.export:main"
[tool.setuptools.packages.find]
where = ["src"]
