<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="800" viewBox="0 0 1120 800" role="img" aria-labelledby="title desc">
  <title id="title">How fisheye images become a perspective, panorama, or tiny planet</title>
  <desc id="desc">Orientation changes where you look, horizontal FOV changes how wide you see, and projection changes how viewing directions map onto a flat image. For each output pixel, the renderer constructs a ray, rotates it into the rig coordinate system, projects it through the calibrated lenses, and blends valid source samples. A panorama is optional, not an intermediate required for the perspective output.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#527087"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#183247}.title{font-size:27px;font-weight:700}.label{font-size:20px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#426077}.tag{font-size:13px;fill:#087d77;font-weight:700;letter-spacing:1px}.line{fill:none;stroke:#527087;stroke-width:2;marker-end:url(#arrow)}.grid{fill:none;stroke:#8ab8c2;stroke-width:1.5}</style>
  </defs>
  <rect width="1120" height="800" rx="20" fill="#f3f7fa"/>
  <text x="32" y="44" class="title">One captured scene. Three choices shape your view.</text>
  <rect x="24" y="70" width="1072" height="256" rx="14" fill="#fff"/>
  <text x="48" y="104" class="tag">01 · WHERE YOU LOOK</text>
  <circle cx="157" cy="207" r="74" class="grid"/>
  <ellipse cx="157" cy="207" rx="74" ry="26" class="grid"/>
  <ellipse cx="157" cy="207" rx="26" ry="74" class="grid"/>
  <path d="M157 207L208 157" stroke="#087d77" stroke-width="3" marker-end="url(#arrow)"/>
  <circle cx="157" cy="207" r="5" fill="#087d77"/>
  <text x="256" y="168" class="label">Orientation</text>
  <text x="256" y="199" class="body">Yaw: left / right</text>
  <text x="256" y="225" class="body">Pitch: up / down</text>
  <text x="256" y="251" class="body">Roll: tilt the horizon</text>
  <text x="48" y="305" class="small">The virtual camera turns; the physical cameras stay fixed.</text>
  <path d="M545 91V304" stroke="#d8e3e9"/>
  <text x="571" y="104" class="tag">02 · HOW MUCH YOU SEE</text>
  <path d="M667 275L583 143H751Z" fill="#dbf2ec" stroke="#087d77" stroke-width="2"/>
  <path d="M667 275L633 143H701Z" fill="#8ad2c5"/>
  <path d="M638 230Q667 209 696 230" fill="none" stroke="#087d77" stroke-width="2"/>
  <circle cx="667" cy="275" r="5" fill="#183247"/>
  <text x="667" y="197" text-anchor="middle" class="body">FOV</text>
  <text x="784" y="168" class="label">Horizontal field of view</text>
  <text x="784" y="199" class="body">Narrow → closer framing</text>
  <text x="784" y="225" class="body">Wide → more surroundings</text>
  <text x="784" y="259" class="small">Top-down view of viewing rays</text>
  <text x="571" y="305" class="small">Aspect ratio changes vertical coverage. Pixels are never stretched.</text>
  <text x="32" y="365" class="tag">03 · HOW DIRECTIONS BECOME A FLAT IMAGE</text>
  <rect x="24" y="385" width="342" height="216" rx="14" fill="#fff"/>
  <path d="M62 485L93 416H299L328 485Z" fill="#e7f4f7" stroke="#8ab8c2"/>
  <path d="M79 451H315M115 485L133 416M171 485L173 416M228 485L214 416M283 485L254 416" class="grid"/>
  <text x="45" y="520" class="label">Perspective</text>
  <text x="45" y="548" class="body">A familiar camera-like viewport.</text>
  <text x="45" y="576" class="small">Reframe · FOV zoom · barrel roll</text>
  <rect x="389" y="385" width="342" height="216" rx="14" fill="#fff"/>
  <rect x="480" y="411" width="160" height="80" rx="4" fill="#e7f4f7" stroke="#8ab8c2"/>
  <path d="M480 438H640M480 464H640M520 411V491M560 411V491M600 411V491" class="grid"/>
  <text x="410" y="520" class="label">Equirectangular</text>
  <text x="410" y="548" class="body">Longitude × latitude, in a 2:1 map.</text>
  <text x="410" y="576" class="small">The complete 360° × 180° scene</text>
  <rect x="754" y="385" width="342" height="216" rx="14" fill="#fff"/>
  <circle cx="925" cy="451" r="46" fill="#e7f4f7" stroke="#8ab8c2"/>
  <circle cx="925" cy="451" r="29" class="grid"/><circle cx="925" cy="451" r="12" class="grid"/>
  <path d="M879 451H971M925 405V497M893 419L957 483M893 483L957 419" class="grid"/>
  <text x="775" y="520" class="label">Stereographic</text>
  <text x="775" y="548" class="body">Spread directions around the center.</text>
  <text x="775" y="576" class="small">Tiny Planet / Inverted Tiny Planet</text>
  <rect x="24" y="625" width="1072" height="147" rx="14" fill="#e3f4ef"/>
  <text x="44" y="655" class="label">Inside the renderer · repeated for every output pixel</text>
  <text x="44" y="696" class="body">Output pixel</text><path d="M143 690H175" class="line"/>
  <text x="190" y="696" class="body">Projection ray</text><path d="M300 690H332" class="line"/>
  <text x="347" y="696" class="body">Orientation</text><path d="M440 690H472" class="line"/>
  <text x="487" y="696" class="body">Lens calibration</text><path d="M614 690H646" class="line"/>
  <text x="661" y="696" class="body">2 fisheye samples</text><path d="M802 690H834" class="line"/>
  <text x="849" y="696" class="body">Blend → output color</text>
  <text x="44" y="741" class="small">Direct source sampling: a perspective view does not first need a panorama. Calibration maps each ray to source pixels.</text>
</svg>
